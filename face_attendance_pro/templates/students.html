{% extends "base.html" %}{% block content %}<header><div><p class="eyebrow">STUDENT MANAGEMENT</p><h1>Students</h1></div><a class="btn" href="/register">＋ Add Student</a></header><div class="card"><table><tr><th>Name</th><th>Roll</th><th>Course</th><th>Email</th><th>Action</th></tr>{% for s in students %}<tr><td>◉ {{s.name}}</td><td>{{s.roll_no}}</td><td>{{s.course}}</td><td>{{s.email or '-'}}</td><td><form method="post" action="/student/delete/{{s.id}}" onsubmit="return confirm('Delete?')"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="5">No students.</td></tr>{% endfor %}</table></div>{% endblock %}
