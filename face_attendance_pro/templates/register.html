{% extends "base.html" %}{% block content %}<header><div><p class="eyebrow">STUDENT MANAGEMENT</p><h1>Register Student</h1><p class="muted">Capture 15 face samples for recognition.</p></div></header><div class="grid"><div class="card"><label>Name</label><input id="name" placeholder="Student name"><label>Roll No</label><input id="roll" placeholder="23B51185"><label>Email</label><input id="email"><label>Phone</label><input id="phone"><label>Course</label><input id="course" value="BCA"><button class="btn" onclick="capture()">📷 Start Camera</button><p id="msg" class="muted"></p></div><div class="card"><div class="camera"><video id="video" autoplay playsinline></video><div class="scanline"></div></div><p><b id="count">0</b> / 15 samples</p><button class="btn wide" onclick="save()">✓ Save & Train Model</button></div></div><script>let s,imgs=[];async function capture(){if(!name.value||!roll.value){msg.textContent='Enter name and roll';return}s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=s;let i=0,t=setInterval(()=>{if(i>=15){clearInterval(t);s.getTracks().forEach(x=>x.stop());return}let c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);imgs.push(c.toDataURL('image/jpeg',.85));count.textContent=++i},400)}async function save(){msg.textContent='Training...';let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,roll_no:roll.value,email:email.value,phone:phone.value,course:course.value,images:imgs})});let j=await r.json();msg.textContent=j.message;if(j.ok)setTimeout(()=>location='/students',800)}</script>{% endblock %}
