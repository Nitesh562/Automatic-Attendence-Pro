{% extends "base.html" %}{% block content %}<header><div><p class="eyebrow">LIVE FACE RECOGNITION</p><h1>Take Attendance</h1><p class="muted">Look at camera and slowly turn your head. The scan animation is a visual liveness prompt.</p></div><span class="live">● LIVE</span></header><div class="grid"><div class="card"><div class="camera"><video id="video" autoplay playsinline></video><div class="scanline"></div></div><p id="status">Starting camera...</p></div><div class="card result"><div class="avatar">◉</div><h2 id="person">Ready</h2><p id="detail" class="muted">Recognized student appears here.</p><div class="pulse">LIVENESS CHECK ACTIVE</div><a class="btn secondary wide" href="/reports">Daily Report</a></div></div><script>let stream,busy=false;async function start(){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;setInterval(scan,1600)}async function scan(){if(busy||!video.videoWidth)return;busy=true;let c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);try{let r=await fetch('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:c.toDataURL('image/jpeg',.8)})});let j=await r.json();status.textContent=j.message;if(j.ok){person.textContent=j.student.name;detail.textContent='Roll No: '+j.student.roll_no+' • '+j.message}}finally{busy=false}}start().catch(e=>status.textContent='Camera error: '+e.message)</script>{% endblock %}
