{% extends "base.html" %}{% block content %}<header><div><p class="eyebrow">ATTENDANCE REPORT</p><h1>Present / Absent Report</h1></div><a class="btn" href="/api/export?date={{selected}}">⬇ Export Excel CSV</a></header><div class="card"><form><input type="date" name="date" value="{{selected}}"><button class="btn">View Date</button></form></div><div class="card"><table><tr><th>Student</th><th>Roll No</th><th>Status</th><th>Time</th></tr>{% for r in rows %}<tr><td>{{r[0]}}</td><td>{{r[1]}}</td><td><span class="badge {{'present' if r[2]=='Present' else 'absent'}}">{{r[2]}}</span></td><td>{{r[3]}}</td></tr>{% else %}<tr><td colspan="4">No students registered.</td></tr>{% endfor %}</table></div>{% endblock %}
